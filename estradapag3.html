<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ATHLETIX MX - Tutoriales</title>
  
  <!-- Bootstrap 4.4.1 CSS -->
  <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.4.1/css/bootstrap.min.css">

  <style>
    body {
      background: linear-gradient(120deg, #000000, #0d6efd);
      font-family: 'Arial', sans-serif;
      color: white;
    }

    /* Navbar */
    .navbar {
      background: linear-gradient(90deg, #000, #0d6efd);
    }
    .navbar-brand {
      display: flex;
      align-items: center;
      font-weight: bold;
    }
    .navbar-brand img {
      width: 40px;
      height: 40px;
      object-fit: contain;
      margin-right: 10px;
      border-radius: 8px;
    }

    /* Banner */
    .banner {
      width: 100%;
      height: 400px;
      object-fit: cover;
    }

    /* Títulos */
    h1, h2 {
      font-weight: bold;
    }
    h2 {
      margin-top: 40px;
    }

    /* Contenedor del Video Modificado para ser Responsivo */
    .video-wrapper {
      max-width: 800px; /* Evita que el video se haga gigantesco en pantallas muy grandes */
      margin: 0 auto;
    }
    
    video {
      width: 100%;
      border-radius: 10px;
      box-shadow: 0px 5px 15px rgba(0,0,0,0.5);
      display: block;
    }

    /* Navegación Inferior Estilo Barra */
    .nav-inferior {
      background: #000000;
      border: 3px solid #333; 
      border-radius: 10px;
      padding: 15px;
      box-shadow: 0px 5px 15px rgba(0,0,0,0.4);
    }
    .nav-inferior a {
      color: white;
      text-decoration: none;
      font-weight: bold;
      transition: color 0.2s;
    }
    .nav-inferior a:hover {
      color: #0d6efd;
    }
    
    .link-volver {
      font-weight: bold;
      color: white;
      transition: color 0.2s;
    }
    .link-volver:hover {
      color: #0d6efd;
      text-decoration: none;
    }
  </style>
</head>
<body>

  <!-- Encabezado / Navegación -->
  <header>
    <nav class="navbar navbar-expand-lg navbar-dark">
      <div class="container-fluid">
        <a class="navbar-brand" href="index.html">
          <img src="imagenes/logo.png" alt="Logo ATHLETIX MX">
          ATHLETIX MX
        </a>
        <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#menu" aria-controls="menu" aria-expanded="false" aria-label="Toggle navigation">
          <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="menu">
          <ul class="navbar-nav mr-auto">
            <li class="nav-item">
              <a class="nav-link" href="estradapag1.html">ARTICULOS</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="estradapag4.html">MINIJUEGOS</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="estradapag2.html">PROMOCIONES</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="estradapag5.html">PEDIDOS</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="estradapag6.html">BIOGRAFIA</a>
            </li>
          </ul>

          <form class="form-inline my-2 my-lg-0">
            <input class="form-control mr-2" type="search" placeholder="Buscar" aria-label="Buscar">
            <button class="btn btn-light" type="submit">BUSCAR</button>
          </form>
        </div>
      </div>
    </nav>
  </header>

  <!-- Banner Principal -->
  <section class="hero-banner">
    <img src="imagenes/banner1.png" class="banner" alt="Banner Tutoriales">
    <h1 class="text-center my-4">TUTORIALES</h1>
  </section>

  <!-- Zona del Video de Entrenamiento -->
  <main class="container my-5">
    <section class="text-center mb-5">
      <h2 class="mb-4">Entrenamientos Profesionales ⚽</h2>
      
      <div class="video-wrapper px-3">
        <video controls>
          <!-- Apunta a una carpeta llamada 'videos' dentro de tu proyecto -->
          <source src="videos/entrenamiento2.mp4" type="video/mp4">
          Tu navegador no soporta video.
        </video>
      </div>
    </section>

    <!-- Menú de Navegación Inferior -->
    <nav class="nav-inferior container my-5">
      <div class="row text-center">
        <div class="col-sm col-12 my-1"><a href="index.html">INICIO</a></div>
        <div class="col-sm col-12 my-1"><a href="estradapag1.html">ARTICULOS</a></div>
        <div class="col-sm col-12 my-1"><a href="estradapag2.html">PROMOCIONES</a></div>
        <div class="col-sm col-12 my-1"><a href="estradapag4.html">MINIJUEGOS</a></div>
        <div class="col-sm col-12 my-1"><a href="estradapag5.html">PEDIDOS</a></div>
      </div>
    </nav>

    <!-- Enlace de regreso simple -->
    <div class="text-center my-4">
      <a href="index.html" class="link-volver">⬅ Volver al inicio</a>
    </div>
  </main>

  <!-- Bootstrap Scripts -->
  <script src="https://code.jquery.com/jquery-3.4.1.slim.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.0/dist/umd/popper.min.js"></script>
  <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.4.1/js/bootstrap.min.js"></script>

</body>
</html>
